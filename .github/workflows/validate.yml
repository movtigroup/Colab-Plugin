name: Validate / اعتبارسنجی

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate repository / اعتبارسنجی مخزن
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator / اجرای اعتبارسنج
        run: python scripts/validate.py
